<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom — A Conversation on AI in Central Oregon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geom:wght@500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   TOKENS
   ───────────────────────────────────────────── */
:root{
  --ink:#101011;
  --paper:#fff;
  --agree:#1F8A3B;
  --disagree:#D8362F;
  --pass:#C4C4C4;
  --home:#0D1B3E;

  --geom:'Geom','Futura',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',monospace;

  --nav-h:46px;
  --pill-h:58px;
  --scrub-h:34px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* overflow-x here (not on body) — putting it on body makes browsers treat
   body as the sticky/scroll containing block instead of the viewport,
   which silently breaks every position:sticky element on the page */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  background:var(--ink);
  color:#fff;
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid currentColor;outline-offset:3px;border-radius:3px}

/* The whole product lives in one column. Mobile = full bleed.
   Wide viewports = a ~50% column, same layout, nothing reflows. */
.shell{
  width:100%;
  max-width:600px;
  margin:0 auto;
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  background:var(--ink);
}
@media (min-width:660px){
  /* on the roomier desktop layout, the gutter around the column tints to
     match whatever's active — the open theme's color, or --home on L1 */
  body{background:var(--c,var(--home))}
  .shell{max-width:800px}
}

.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ─────────────────────────────────────────────
   LEVEL 1 — THEMES
   ───────────────────────────────────────────── */
#l1{display:block}
.masthead{padding:26px 22px 20px}
.masthead .eyebrow{color:rgba(255,255,255,.45);margin-bottom:9px}
.masthead h1{
  font-family:var(--geom);font-weight:700;font-size:23px;line-height:1.14;
  margin:0;letter-spacing:-.012em;max-width:16em;
}
.masthead p{
  font-size:14px;line-height:1.45;color:rgba(255,255,255,.5);
  margin:12px 0 0;max-width:32em;
}

.theme-block{
  display:block;width:100%;text-align:left;
  background:var(--c);
  padding:22px 22px 24px;
  position:relative;
  transition:filter .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.theme-block + .theme-block{box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.theme-block h2{
  font-family:var(--geom);font-weight:700;
  font-size:clamp(26px,7.4vw,32px);line-height:1.06;
  letter-spacing:-.02em;margin:0 0 11px;
  max-width:13em;
}
.theme-block .count{color:rgba(255,255,255,.78);margin-bottom:16px}
.theme-block .arrow{
  position:absolute;top:24px;right:20px;font-size:17px;
  opacity:.45;transition:transform .3s ease,opacity .3s ease;
}
@media (hover:hover){
  .theme-block:hover{filter:brightness(1.12) saturate(1.05)}
  .theme-block:hover .arrow{transform:translateX(5px);opacity:1}
}
.theme-block:active{filter:brightness(.94)}

/* the tally: one cell per record. filled = poll statement, ring = session quote */
.tally{
  display:grid;
  grid-template-columns:repeat(auto-fill,12px);
  gap:4px;
}
.tally i{
  display:block;width:12px;height:12px;border-radius:1.5px;
  background:#fff;
  animation:tallyIn .5s cubic-bezier(.2,.8,.3,1) both;
}
.tally i.q{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1.5px #fff}
@keyframes tallyIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

.legend{
  padding:20px 22px 46px;display:flex;gap:20px;flex-wrap:wrap;
  color:rgba(255,255,255,.42);
}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:1.5px;background:rgba(255,255,255,.6);flex:none}
.legend i.q{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}

/* ─────────────────────────────────────────────
   LEVEL 2 — THEME VIEWER
   ───────────────────────────────────────────── */
#l2{
  display:none;background:var(--c);min-height:100vh;min-height:100dvh;
  position:relative;
}
#l2.on{display:block}

.l2nav{
  position:sticky;top:0;z-index:30;
  transition:opacity .28s ease;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:var(--c);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.2);
}
.l2nav button{
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.82);padding:6px 0;
  transition:color .2s ease;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.l2nav button:hover{color:#fff}
.l2nav .nextT{max-width:62%;text-align:right}
.l2nav .nextT b{font-weight:400;color:#fff}

.hero{padding:26px 22px 0;position:relative}
.hero::before{
  content:'';position:absolute;inset:calc(-1 * var(--nav-h)) 0 auto 0;height:340px;
  background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,0));
  pointer-events:none;
}
.hero > *{position:relative}
.hero h1{
  font-family:var(--geom);font-weight:700;
  font-size:clamp(30px,9vw,40px);line-height:1.02;letter-spacing:-.024em;
  margin:0 0 9px;
}
.hero .count{color:rgba(255,255,255,.72);margin-bottom:20px}
.hero .desc{
  font-size:16.5px;line-height:1.5;margin:0 0 26px;
  color:#fff;letter-spacing:-.003em;
}
.hero .cta{font-size:15px;font-weight:600;margin-bottom:28px}
@media (min-width:660px){
  /* placed after the base rules above so it actually wins the cascade —
     an earlier attempt put this override before them and silently lost */
  .masthead p{font-size:16px}
  .hero .desc{font-size:18.5px}
  .hero .cta{font-size:17px}
}

/* mode pills — stay reachable while you scroll the lane. A sibling of
   .hero and .lane (not nested in .hero) so its sticky containing block
   is the whole scrollable section, not just the short intro block —
   otherwise it un-sticks the moment .hero itself scrolls out of view. */
.pills{
  position:sticky;top:var(--nav-h);z-index:25;
  display:flex;justify-content:center;gap:8px;
  padding:18px 22px;
  background:var(--c);
  border-top:1px solid rgba(255,255,255,.17);
  border-bottom:1px solid rgba(255,255,255,.17);
}
.pills::before{
  content:'';position:absolute;left:0;right:0;top:-14px;height:14px;
  background:var(--c);
}
/* while a statement is open, fade the chrome so the selected square
   stays visible in the strip above the card */
body.reading .l2nav,body.reading .pills{opacity:0;pointer-events:none}
/* extra runway so even the last square in the lane can be lifted into
   the strip above the card. Collapses again when the card closes. */
body.reading #l2{padding-bottom:82vh}
.pills{transition:opacity .28s ease}

.pills button{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 15px;border-radius:999px;
  background:rgba(255,255,255,.17);color:#fff;
  transition:background .2s ease,color .2s ease;
}
.pills button:hover{background:rgba(255,255,255,.28)}
.pills button[aria-pressed="true"]{background:#fff;color:var(--c);font-weight:500}

/* the lane */
.lane{
  position:relative;
  overflow:visible;
  display:flow-root;   /* stop scrub/minimap's margin-top from collapsing into .lane's own position */
}
.axisrow{
  position:absolute;left:0;right:0;height:0;
  border-top:1px solid rgba(255,255,255,.17);
  pointer-events:none;
}
.axisrow span{
  position:absolute;right:9px;top:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.78);
}

/* QUOTES mode — a plain stack of cards instead of the scattered lane */
.lane.quotesList{
  display:flex;flex-direction:column;gap:12px;
  padding:6px 22px 46px;
}
.qcard{
  display:block;width:100%;text-align:left;
  background:#fff;border-radius:20px;
  padding:18px 20px 20px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s ease,box-shadow .2s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.qeyebrow{color:var(--c);margin-bottom:9px}
.qtext{
  margin:0;color:var(--ink);
  font-family:var(--geom);font-weight:600;
  font-size:16.5px;line-height:1.4;letter-spacing:-.006em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
@media (hover:hover){
  .qcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.22)}
}
.qcard.sel{box-shadow:0 0 0 3px var(--c),0 10px 30px rgba(0,0,0,.28)}

/* LIST mode — same records/order as Map, but a plain card stack like
   Quotes: full statement text, an emoji icon, and a tiered score pill */
.lane.listView{
  display:flex;flex-direction:column;gap:12px;
  padding:6px 22px 46px;
}
/* sticks directly below the nav + pills (same measured offset the
   minimap uses in Map mode), bleeding edge-to-edge like .pills despite
   the lane's own side padding */
.listTop{
  position:sticky;z-index:24;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0 -22px;
  padding:14px 22px;
  background:var(--c);
  border-bottom:1px solid rgba(255,255,255,.17);
  transition:opacity .28s ease;
}
body.reading .listTop{opacity:0;pointer-events:none}
.orderSwitch{
  font-family:var(--body);font-size:13px;font-weight:600;
  color:#fff;
  background:rgba(255,255,255,.1);
  padding:9px 16px;border-radius:999px;
  transition:background .2s ease;
}
.orderSwitch:hover{background:rgba(255,255,255,.18)}
.orderSwitch:active{background:rgba(255,255,255,.08)}
.listKey{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.04em;
  color:rgba(255,255,255,.85);
}
.lKeySq{
  flex:none;display:grid;place-items:center;
  width:17px;height:17px;
  background:#fff;border-radius:4px;
  font-family:var(--geom);font-weight:700;font-size:10px;color:var(--c);
}
.lcard{
  display:block;width:100%;text-align:left;
  background:#fff;border-radius:20px;
  padding:16px 18px 0;
  overflow:hidden;   /* so the bottom viz's bleed can meet the card's own rounded corners */
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s ease,box-shadow .2s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
@media (hover:hover){
  .lcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.22)}
}
.lcard.sel{box-shadow:0 0 0 3px var(--c),0 10px 30px rgba(0,0,0,.28)}

/* eyebrow — the participant's emoji plus their demographic chips,
   marqueeing sideways when the text is too long for the card */
.lWho{
  display:flex;align-items:center;gap:8px;
  margin-bottom:9px;
  color:color-mix(in srgb,var(--c) 62%,#000);
}
.lWho .lEmoji{flex:none;font-size:15px;line-height:1}
.lWho .lDemoWrap{flex:1;min-width:0;overflow:hidden}
.lWho .lDemoTrack{
  display:inline-flex;gap:2.4em;white-space:nowrap;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.lWho .lDemoTrack.marquee{animation:lDemoScroll var(--marquee-dur,10s) linear infinite}
@keyframes lDemoScroll{from{transform:translateX(0)}to{transform:translateX(var(--marquee-dist,-50%))}}

.lText{
  margin:0 0 16px;color:var(--ink);
  font-family:var(--geom);font-weight:600;
  font-size:23px;line-height:1.32;letter-spacing:-.012em;
}

/* bottom viz — where each group's agreement % lands on a disagree-to-
   agree track. Labels sit in the card's normal (uncolored) flow; only
   the track itself is tinted and bled flush to the card's edges (and
   its bottom corners). */
.lBarLabels{
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(0,0,0,.8);
  margin-bottom:8px;
}
.lBarLabels .who{flex:none}
.lBar{
  margin:0 -18px;
  padding:10px 18px 14px;
  background:color-mix(in srgb,var(--c) 13%,transparent);
}
.lBarTrack{position:relative;height:26px}
/* 0%/100% end labels — centered on the same 13px inset the A/B squares
   use at their own extremes (HALF_SQ in the JS), so a square sitting
   right on 0% or 100% lands directly on top of its label */
.lBarEdge{
  position:absolute;top:50%;
  font-family:var(--geom);font-weight:700;font-size:14px;
  color:var(--c);opacity:.65;
}
.lBarEdge.lo{left:13px;transform:translate(-50%,-50%)}
.lBarEdge.hi{right:13px;transform:translate(50%,-50%)}
.lBarMid{
  position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:rgba(0,0,0,.18);
  transform:translateX(-50%);
}
.lBarLine{
  position:absolute;top:50%;height:2.5px;
  background:var(--c);transform:translateY(-50%);
}
.lBarSq{
  position:absolute;top:50%;width:26px;height:26px;
  transform:translate(-50%,-50%);
  background:var(--c);border-radius:6px;
  display:grid;place-items:center;
  font-family:var(--geom);font-weight:700;font-size:11px;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

.sq{
  position:absolute;padding:0;
  background:none;border:0;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .35s ease;
  z-index:20;   /* above the scrub line (18) so it never draws over a statement circle */
}
/* while a bubble is surfacing a couple of statements, dim the rest so
   the callouts read clearly — everything stays clickable underneath.
   Whatever the scrub indicator is crossing stays fully visible too. */
.lane.bubbling .sq:not(.hl):not(.hit){opacity:.3}
/* same idea for the scrub indicator (and hovering a circle directly) —
   dim everything but whatever's hit/hovered so it reads clearly */
.lane:has(.sq.hit, .sq:hover) .sq:not(.hit):not(:hover){opacity:.3}
.sq .face{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  background:#fff;border-radius:50%;
  line-height:1;
  animation:breathe var(--dur,4s) ease-in-out var(--del,0s) infinite;
  transition:box-shadow .25s ease;
  will-change:transform;
}
@keyframes breathe{
  0%,100%{transform:scale(.955)}
  50%{transform:scale(1.075)}
}
@media (hover:hover){
  .sq:hover .face{
    animation-play-state:paused;transform:scale(1.09);
    box-shadow:0 0 0 5px #fff,0 8px 26px rgba(0,0,0,.3);
  }
}
.sq.sel .face{
  animation-play-state:paused;transform:scale(1.06);
  box-shadow:0 0 0 4px rgba(255,255,255,.4),0 8px 26px rgba(0,0,0,.3);
}
/* the square currently crossed by the scrub line */
.sq.hit .face{box-shadow:0 0 0 5px #ffd400,0 8px 26px rgba(0,0,0,.3)}

/* the little text bubbles that surface every few seconds */
.bubble{
  position:absolute;z-index:12;
  max-width:min(210px,calc(100vw - 24px));
  font-size:11.5px;line-height:1.35;
  font-weight:500;
  padding:6px 11px;border-radius:999px;
  background:#fff;color:var(--c);
  box-shadow:0 4px 16px rgba(0,0,0,.22);
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:scale(.8);
  transition:opacity .3s cubic-bezier(.3,.7,.3,1),transform .3s cubic-bezier(.3,.7,.3,1);
}
.bubble.in{opacity:1;transform:scale(1)}

/* the scrub — a readout that lives at the max line of the lane (where it
   sits in normal flow, via margin-top) until scrolling would carry it
   above the screen's midpoint, at which point it sticks there. */
.scrub{
  position:sticky;top:50vh;
  height:var(--scrub-h);
  z-index:18;   /* below .sq (20) so statement circles draw over the line, above .minimap (15) */
  display:flex;align-items:center;
  pointer-events:none;
  transition:opacity .28s ease;
}
.scrub .pill{
  flex:none;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;
  background:#fff;color:var(--c);
  padding:9px 14px 9px 13px;
  border-radius:0 999px 999px 0;
  white-space:nowrap;
}
.scrub .line{
  flex:1 1 auto;height:2px;
  background:#fff;
}
body.reading .scrub{opacity:0;pointer-events:none}

/* the minimap — a condensed sparkline of every statement's position on
   the current axis, living only inside the lane. Scrolls up with the
   lane until fully below the nav + pills, then sticks there — top and
   height are set in JS since they depend on the pills bar's rendered
   height and the viewport size. z-index sits below .scrub so the
   indicator line draws over it where the two cross. */
.minimap{
  position:sticky;left:0;
  width:40px;
  z-index:15;
  background:rgba(255,255,255,.12);
  border-radius:4px;
  pointer-events:none;
  transition:opacity .28s ease;
}
.minimap[hidden]{display:none}
.minimap i{
  position:absolute;left:0;right:0;height:2px;
  background:rgba(255,255,255,.55);
  border-radius:1px;
  transform:translateY(-50%);
}
.minimap .now{
  position:absolute;left:0;right:0;height:3px;
  background:#ffd400;
  border-radius:2px;
  box-shadow:0 0 8px rgba(255,212,0,.75);
  transform:translateY(-50%);
}
body.reading .minimap{opacity:0;pointer-events:none}

/* statement preview — a bottom sheet previewing whatever the scrub is
   currently crossing. Slides up once, the first time it has something
   to show; after that it only ever fades between shown/empty, never
   slides away again. */
.statPreview{
  position:fixed;left:0;right:0;bottom:0;
  z-index:26;
  display:flex;justify-content:center;
  pointer-events:none;
  transform:translateY(115%);
  transition:transform .4s cubic-bezier(.2,.85,.3,1),opacity .3s ease;
}
.statPreview[hidden]{display:none}
.statPreview.shown{transform:translateY(0)}
.statPreview.empty{opacity:0}
body.reading .statPreview{opacity:0;pointer-events:none}

.spCard{
  pointer-events:auto;
  display:flex;align-items:center;gap:12px;
  width:calc(100% - 28px);max-width:572px;   /* matches .card (the statement modal) */
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)) 10px;
  text-align:left;
  box-shadow:0 10px 30px rgba(0,0,0,.32);
  transition:transform .15s ease;
}
.spCard:active{transform:scale(.97)}
.spAv{
  flex:none;width:44px;height:44px;border-radius:50%;
  background:#fff;
  display:grid;place-items:center;
  font-size:23px;
  box-shadow:0 0 0 3px var(--c);
}
.spBody{min-width:0}
.spEyebrow{
  display:block;
  font-family:var(--mono);font-size:0.8rem;letter-spacing:.09em;text-transform:uppercase;font-weight: 500;
  color:var(--c);margin-bottom:3px;
}
.spText{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  color:#333;font-size:1.1rem;line-height:1.35;font-weight:500;
}

.lane-end{
  padding:34px 22px 60px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.4);text-align:center;
}

/* ─────────────────────────────────────────────
   LEVEL 3 — STATEMENT
   ───────────────────────────────────────────── */
#l3{display:none;position:fixed;inset:0;z-index:60}
#l3.on{display:block}
.scrim{
  position:absolute;inset:0;background:rgba(10,10,12,.42);
  animation:fadeIn .3s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.card{
  position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(100% - 28px);max-width:572px;
  height:min(76vh,720px);
  background:var(--paper);color:var(--c);
  border-radius:24px;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.34);
  animation:cardIn .34s cubic-bezier(.2,.85,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-46%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%)}}

.cardtop{
  display:flex;align-items:center;
  padding:13px 16px 13px 14px;flex:none;
  background:var(--paper);
  border-bottom:1px solid color-mix(in srgb,var(--c) 16%,#fff);
  border-radius:24px 24px 0 0;
}
/* consensus / difference / plain-agreement indicator for poll statements
   (quotes have no vote data, so the pill is hidden entirely for those) */
.who{
  display:inline-flex;align-items:center;gap:8px;
  color:#fff;
  border-radius:999px;padding:5px 13px 5px 5px;
  min-height:30px;max-width:82%;
}
.who[hidden]{display:none}
.who.consensus{background:var(--agree)}
.who.difference{background:var(--disagree)}

.cardbody{
  flex:1 1 auto;min-height:0;

  overscroll-behavior:contain;
}

  color:var(--c);
  text-wrap:pretty;
}

.meta{
  border-top:1px solid color-mix(in srgb,var(--c) 18%,#fff);
  padding:18px 22px 24px;
}
.meta h4{
  font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 55%,#fff);

}
.meta .src{font-size:14px;line-height:1.4;margin:0 0 16px;font-weight:500}
.meta .src small{display:block;font-weight:400;font-size:12.5px;margin-top:2px}
.meta section + section{margin-top:16px}

.grow{margin-bottom:11px}
.grow:last-child{margin-bottom:2px}
.grow .top{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 62%,#fff);
  margin-bottom:5px;
}
.grow .top b{font-weight:500;color:var(--c)}
.bar{display:flex;gap:2px;height:3px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:flex-grow .4s ease}
.bar .d{background:var(--disagree)}
.bar .p{background:var(--pass)}
.bar .a{background:var(--agree)}
.barkey{
  display:flex;gap:13px;margin-top:9px;
  font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 48%,#fff);
}
.barkey span{display:inline-flex;align-items:center;gap:5px}
.barkey i{width:9px;height:3px;border-radius:2px;flex:none}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{
  font-style:normal;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 11%,#fff);
  color:var(--c);
}

.cardfoot{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;
  border-top:1px solid color-mix(in srgb,var(--c) 20%,#fff);
  background:var(--paper);
}
.cardfoot button{
  width:44px;height:36px;display:grid;place-items:center;color:var(--c);
  border-radius:10px;transition:background .18s ease,opacity .18s ease;
}
.cardfoot button:hover{background:color-mix(in srgb,var(--c) 9%,#fff)}
.cardfoot button[disabled]{opacity:.24;cursor:default;background:none}
.cardfoot svg{width:26px;height:14px;stroke:currentColor;stroke-width:1.9;fill:none}
.cardfoot .pos{
  font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--c);
}
.cardfoot .pos em{font-style:normal;opacity:.45}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

<script type="application/json" id="theme-descriptions">
{
  "_readme": "Editable copy for the Level 2 theme headers. Keyed by theme key. Each entry has a 'description' (the paragraph under the statement count) and an optional 'note' (currently unused by the UI, kept for editorial context). Percentages are drawn from OR_Open_Poll_Analysis_2 tallies: Group A (~131 participants) skews skeptical, Group B (~201) skews optimistic. If you edit a number here, check it against the underlying statement — the app does not recompute these.",
  "_groups": {
    "A": "Skeptics (Polis Group A, ~131 participants)",
    "B": "Optimists (Polis Group B, ~201 participants)"
  },
  "themes": {
    "governance": {
      "description": "There is almost no argument about who belongs in the room: involving rural and lower-income communities draws 91% and 94%, a formal seat for the Confederated Tribes of Warm Springs 91% and 90%. The fight is over what those rooms are for. Skeptics endorse the flat claim that AI's costs outweigh any benefit (83% vs 6%).",
      "note": "Largest theme in the poll (24 statements) and the one where procedural consensus most clearly outruns substantive agreement."
    },
    "datacenters": {
      "description": "The divide is fundamentally about the economic bargain. Optimists are far more receptive to the jobs-and-tax-revenue case (42% agree, against 1% of Skeptics), while Skeptics overwhelmingly endorse a firsthand account that the construction jobs are temporary and out-of-state (89% vs 54%). Both want disclosure: electricity reporting runs 99%/92%.",
      "note": "The only theme where a single statement — the jobs-and-tax-revenue framing — is rejected almost absolutely by one group."
    },
    "education": {
      "description": "Everyone wants rules — clear school policies on student use (94%/92%), transparency about how teachers and administrators use it (96%/91%). The disagreement is about cognition. Skeptics accept that AI is taking opportunity from artists and brain cells from children (95%); Optimists mostly don't (41%).",
      "note": "Second-richest theme in the conversation record — five starred session quotes alongside twelve poll statements."
    },
    "mentalhealth": {
      "description": "The thinnest poll evidence in the set and the thickest conversation record: three statements, nine session quotes. Skeptics far more readily accept that leaning on AI erodes turning to each other (85% vs 49%), and reject the mirror-image framing of AI as connective (11% vs 68%). Both refuse chatbots as teen therapy (6%/20%).",
      "note": "Read this theme through the quotes, not the poll. The vote sample is too small to carry much weight on its own."
    },
    "workforce": {
      "description": "No session quotes landed here, so this is the poll speaking alone. Worker protections travel across the divide — a right to know when AI is evaluating you runs 99%/87%. The split is over whether standing still has a price: Optimists accept that slowing down sends jobs to another state (51% vs 4%).",
      "note": "The competitiveness argument is the single most group-defining framing in the theme."
    },
    "agency": {
      "description": "This is a fight over inevitability, not over risk. Optimists accept that the changes are coming and the task is adaptation rather than resistance (73% vs 11%). Yet both groups want the most powerful systems to prove they can prevent catastrophic outcomes before deployment (94%/78%).",
      "note": "Useful counterweight to the framing that existential-risk concern maps onto AI skepticism. It doesn't, cleanly."
    },
    "access": {
      "description": "Both groups want the same infrastructure of trust: a rigorous, apolitical evidence base (100%/100%, the only perfect agreement in the poll) and disclosure from the algorithms choosing political content (94%/88%). They part company on whether access has arrived — AI replacing expensive professionals draws 82% of Optimists, 38% of Skeptics.",
      "note": "Highest-participation statement in the whole poll sits here (243 votes) and it is a divergent one."
    },
    "privacy": {
      "description": "The least polarized theme in the set, and the one the report has no section for — four statements added to hold what the other seven left uncovered. Parents seeing what minors discuss with AI companion apps draws 78% and 77%; the inverse phrasing is rejected identically at 7%.",
      "note": "Claude-added theme, not editorial. Worth deciding whether it survives into a published version."
    }
  }
}

":239,"A":{"a":12,"d":86,"p":12,"n":110,"pct":11},"B":{"a":94,"d":16,"p":19,"n":129,"pct":73},"gap":62,"minAgree":11,"consensus":0},"source":"Open Poll","tags":[],"inReport":false},{"id":"p53","kind":"poll","text":"I would be fine with AI-related unemployment as long as Oregon had a better a better social safety net.","theme":5,"origin":"cocap_seed","place":null,"chips":["SEED STATEMENT"],"vote":{"total":196,"A":{"a":9,"d":65,"p":21,"n":95,"pct":9},"B":{"a":34,"d":34,"p":33,"n":101,"pct":34},"gap":25,"minAgree":9,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p54","kind":"poll","text":"The jobs being replaced by AI weren’t that essential to begin with. Let’s find more meaningful work for those affected.","theme":5,"origin":"cocap_seed","place":null,"chips":["SEED STATEMENT"],"vote":{"total":184,"A":{"a":5,"d":77,"p":7,"n":89,"pct":6},"B":{"a":20,"d":49,"p":26,"n":95,"pct":21},"gap":15,"minAgree":6,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p55","kind":"poll","text":"Big corporations that are cutting jobs should be required to pay for their employees' retraining, instead of that cost falling on the government.","theme":5,"origin":"cocap_seed","place":null,"chips":["SEED STATEMENT"],"vote":{"total":230,"A":{"a":87,"d":5,"p":11,"n":103,"pct":84},"B":{"a":72,"d":29,"p":26,"n":127,"pct":57},"gap":27,"minAgree":57,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p56","kind":"poll","text":"Slowing down AI in Oregon means the jobs will just go to another state.","theme":5,"origin":"cocap_seed","place":null,"chips":["SEED STATEMENT"],"vote":{"total":217,"A":{"a":4,"d":79,"p":19,"n":102,"pct":4},"B":{"a":59,"d":27,"p":29,"n":115,"pct":51},"gap":47,"minAgree":4,"consensus":0},"source":"Open Poll","tags":[],"inReport":false},{"id":"p57","kind":"poll","text":"I don't think parents should be able to monitor their teenagers' chat logs in ChatGPT, etc – ":{"total":235,"A":{"a":10,"d":85,"p":17,"n":112,"pct":9},"B":{"a":66,"d":32,"p":25,"n":123,"pct":54},"gap":45,"minAgree":9,"consensus":0},"source":"Open Poll","tags":["Existential Risk"],"inReport":false},{"id":"p62","kind":"poll","text":"Companies building the most powerful AI systems should be required to show they can prevent catastrophic outcomes before deploying them.","theme":6,"origin":"participant","place":"Bend","chips":["BEND, OR","Not Provided"],"vote":{"total":209,"A":{"a":92,"d":3,"p":3,"n":98,"pct":94},"B":{"a":87,"d":7,"p":17,"n":111,"pct":78},"gap":16,"minAgree":78,"consensus":0},"source":"Open Poll","tags":["AI Companies","Existential Risk"],"inReport":false},{"id":"p63","kind":"poll","text":"There needs to be more education on AI for the general public before many of these statements can be addressed. In using social media anymore there is no way to know if what I am reading/seeing is real or AI so I don't trust it anymore.","theme":7,"origin":"participant","place":"Bend","chips":["BEND, OR","65+","FEMALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":184,"A":{"a":76,"d":7,"p":7,"n":90,"pct":84},"B":{"a":78,"d":10,"p":6,"n":94,"pct":83},"gap":1,"minAgree":83,"consensus":1},"source":"Open Poll","tags":["Public Education","News & (mis)information"],"inReport":false},{"id":"p64","kind":"poll","text":"AI fundamentally restructures the foundations of capitalism. All training data for AI is either other people's intellectual property or in the public domain. Therefore, AI should be publicly owned only. No private ownership.","theme":1,"origin":"participant","place":"Bend","chips":["BEND, OR","Not Provided"],"vote":{"total":186,"A":{"a":77,"d":2,"p":16,"n":95,"pct":81},"B":{"a":34,"d":27,"p":30,"n":91,"pct":37},"gap":44,"minAgree":37,"consensus":0},"source":"Open Poll","tags":["Government / Public Sector","Governance & Decision-making"],"inReport":false},{"id":"p65","kind":"poll","text":"We need transparency from governments (city and county) on AI usage, from office software to data centers, and a willingness of government officials to listen and scale back AI usage if asked to.","theme":1,"origin":"participant","place":"Powell Butte","chips":["POWELL BUTTE, OR","18-24","FEMALE","WHITE OR CAUCASIAN"],"vote":{"total":171,"A":{"a":82,"d":2,"p":4,"n":88,"pct":93},"B":{"a":63,"d":11,"p":9,"n":83,"pct":76},"gap":17,"minAgree":76,"consensus":0},"source":"Open Poll","tags":["Government / Public Sector"],"inReport":false},{"id":"p67","kind":"poll","text":"AI often provides inaccurate information (occasionally harmfully). While it could be viewed as useful, most students use it as a crutch more than a tool that ends up negatively impacting their ability to think critically and problem solve.","theme":3,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","25-34","OTHER","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":142,"A":{"a":71,"d":1,"p":2,"n":74,"pct":96},"B":{"a":37,"d":8,"p":23,"n":68,"pct":54},"gap":42,"minAgree":54,"consensus":0},"source":"Open Poll","tags":["Education"],"inReport":false},{"id":"p68","kind":"poll","text":"I don’t think AI has benefits that outweigh the environmental and social repercussions of computer-based control over our lives and information. Taxing tech companies to neutralize their profits on AI and using proceeds to fund public needs","theme":2,"origin":"participant","place":"Prineville","chips":["PRINEVILLE, OR","Not Provided"],"vote":{"total":132,"A":{"a":62,"d":1,"p":9,"n":72,"pct":86},"B":{"a":17,"d":16,"p":27,"n":60,"pct":28},"gap":58,"minAgree":28,"consensus":0},"source":"Open Poll","tags":["Environment"],"inReport":false},{"id":"p70","kind":"poll","text":"This will all be done through education. The only way to mitigate risks or take fear out of something is to educate. Providing opportunities for education is what we've got to focus on.","theme":7,"origin":"participant","place":"Bend","chips":["BEND, OR","55-64","MALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":125,"A":{"a":18,"d":25,"p":25,"n":68,"pct":26},"B":{"a":44,"d":5,"p":8,"n":57,"pct":77},"gap":51,"minAgree":26,"consensus":0},"source":"Open Poll","tags":["Public Education"],"inReport":false},{"id":"p71","kind":"poll","text":"We should not be using children as guinea pigs when it comes to AI. Allowing them to use these tools without guardrails has serious short and long-term risks.","theme":3,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","35-44","MALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":135,"A":{"a":71,"d":0,"p":2,"n":73,"pct":97},"B":{"a":55,"d":1,"p":6,"n":62,"pct":89},"gap":8,"minAgree":89,"consensus":1},"source":"Open Poll","tags":["Youth"],"inReport":false},{"id":"p72","kind":"poll","text":"We need stronger transparency around how AI is being used in the education system – by teachers, administrators, and students.","theme":3,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","35-44","MALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":127,"A":{"a":67,"d":1,"p":2,"n":70,"pct":96},"B":{"a":52,"d":1,"p":4,"n":57,"pct":91},"gap":5,"minAgree":91,"consensus":1},"source":"Open Poll","tags":["Education"],"inReport":false},{"id":"p73","kind":"poll","text":"Central Oregon has massive disparities in AI literacy. We need to help get everyone up to speed on the risks and opportunities AI poses to our communities.","theme":7,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","35-44","MALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":124,"A":{"a":34,"d":13,"p":21,"n":68,"pct":50},"B":{"a":49,"d":0,"p":7,"n":56,"pct":88},"gap":38,"minAgree":50,"consensus":0},"source":"Open Poll","tags":["Public Education"],"inReport":false},{"id":"p74","kind":"poll","text":"The best solutions are education and regulation.","theme":7,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","Not Provided"],"vote":{"total":131,"A":{"a":46,"d":11,"p":15,"n":72,"pct":64},"B":{"a":41,"d":8,"p":10,"n":59,"pct":69},"gap":5,"minAgree":64,"consensus":0},"source":"Open Poll","tags":["Public Education"],"inReport":false},{"id":"p75","kind":"poll","text":"AI is already causing major issues by providing false information and people are relying upon it. There needs to be some sort of federal check.","theme":7,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","55-64","FEMALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":130,"A":{"a":58,"d":4,"p":6,"n":68,"pct":85},"B":{"a":32,"d":15,"p":15,"n":62,"pct":52},"gap":33,"minAgree":52,"consensus":0},"source":"Open Poll","tags":["News & (mis)information"],"inReport":false},{"id":"p76","kind":"poll","text":"AI is taking money and opportunity from artists, writers, musicians, and thinkers. It’s taking brain cells from our children.","theme":3,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","Not Provided"],"vote":{"total":133,"A":{"a":71,"d":3,"p":1,"n":75,"pct":95},"B":{"a":24,"d":21,"p":13,"n":58,"pct":41},"gap":54,"minAgree":41,"consensus":0},"source":"Open Poll","tags":["Education"],"inReport":false},{"id":"p77","kind":"poll","text":"AI is an opportunity to connect people across demographics and cultures to collaborate on how we can leverage the potential for good.","theme":4,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","35-44","FEMALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":125,"A":{"a":7,"d":41,"p":17,"n":65,"pct":11},"B":{"a":41,"d":6,"p":13,"n":60,"pct":68},"gap":57,"minAgree":11,"consensus":0},"source":"Open Poll","tags":["Positive Effects"],"inReport":false},{"id":"p78","kind":"poll","text":"I think the human species is not evolved enough to be able to for see the effects this technology could have on humanity. It is unfortunate that we have the ability to create it.","theme":6,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","Not Provided"],"vote":{"total":130,"A":{"a":58,"d":5,"p":7,"n":70,"pct":83},"B":{"a":15,"d":31,"p":14,"n":60,"pct":25},"gap":58,"minAgree":25,"consensus":0},"source":"Open Poll","tags":["Existential Risk"],"inReport":false},{"id":"p79","kind":"poll","text":"Companies shouldn’t get tax breaks for using AI","theme":5,"origin":"participant","place":"Redmond","chips":["REDMOND, OR","Not Provided"],"vote":{"total":122,"A":{"a":61,"d":5,"p":1,"n":67,"pct":91},"B":{"a":44,"d":5,"p":6,"n":55,"pct":80},"gap":11,"minAgree":80,"consensus":1},"source":"Open Poll","tags":["Workforce / Labor","Economic Benefit"],"inReport":false},{"id":"p80","kind":"poll","text":"AI tech companies are moving too fast. I use Anthropic's Claude and find it to be beneficial in many ways. But I do not trust other companies that may be more interested in control, power and financial gain.","theme":6,"origin":"participant","place":"Powell Butte","chips":["POWELL BUTTE, OR","65+","FEMALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":111,"A":{"a":36,"d":4,"p":18,"n":58,"pct":62},"B":{"a":28,"d":14,"p":11,"n":53,"pct":53},"gap":9,"minAgree":53,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p81","kind":"poll","text":"AI is being used by youth, aging workforce should be trained to create a smooth transition to the incoming workforce.","theme":5,"origin":"participant","place":"Warm Springs","chips":["WARM SPRINGS, OR","35-44","MALE","NATIVE AMERICAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":105,"A":{"a":10,"d":33,"p":16,"n":59,"pct":17},"B":{"a":26,"d":1,"p":19,"n":46,"pct":57},"gap":40,"minAgree":17,"consensus":0},"source":"Open Poll","tags":["Youth","Workforce / Labor"],"inReport":false},{"id":"p86","kind":"poll","text":"AI if so great should already be intuitive and not need training beyond a basuc online youtube - free. It should be able to create its own training.","theme":7,"origin":"participant","place":"Bend","chips":["BEND, OR","Not Provided"],"vote":{"total":84,"A":{"a":5,"d":28,"p":19,"n":52,"pct":10},"B":{"a":3,"d":20,"p":9,"n":32,"pct":9},"gap":1,"minAgree":9,"consensus":-1},"source":"Open Poll","tags":["Public Education"],"inReport":false},{"id":"p88","kind":"poll","text":"Using Ai instead of a person (which would help the economy), benefit$ a small group of companies that have tax breaks (doesn't benefit econ/community), takes - not provides jobs for uninspired results.","theme":5,"origin":"participant","place":"Bend","chips":["BEND, OR","Not Provided"],"vote":{"total":100,"A":{"a":49,"d":3,"p":6,"n":58,"pct":84},"B":{"a":11,"d":12,"p":19,"n":42,"pct":26},"gap":58,"minAgree":26,"consensus":0},"source":"Open Poll","tags":["Economic Benefit","Distribution of Public Benefits"],"inReport":false},{"id":"p89","kind":"poll","text":"Data centers bring temporary construction jobs, use out of state contractors (worked at one), gives a temporary housing shortage (thousands of workers that leave) and VERY few jobs once running. It is monitoring temperature.","theme":2,"origin":"participant","place":"Bend","chips":["BEND, OR","Not Provided"],"vote":{"total":96,"A":{"a":49,"d":1,"p":5,"n":55,"pct":89},"B":{"a":22,"d":4,"p":15,"n":41,"pct":54},"gap":35,"minAgree":54,"consensus":0},"source":"Open Poll","tags":["Data Centers"],"inReport":false},{"id":"p100","kind":"poll","text":"Cities and counties should continue to give huge tax breaks and limit existing regulations so data centers can be built in their area.","theme":2,"origin":"participant","place":"Bend","chips":["BEND, OR","65+","FEMALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":77,"A":{"a":2,"d":45,"p":0,"n":47,"pct":4},"B":{"a":1,"d":27,"p":2,"n":30,"pct":3},"gap":1,"minAgree":3,"consensus":-1},"source":"Open Poll","tags":["Data Centers","Government / Public Sector","Economic Benefit"],"inReport":false},{"id":"p101","kind":"poll","text":"I don't think inAgree":35,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p120","kind":"poll","text":"AI is a tool like many others we use daily. It will be used for good and bad, will change the way we work, but should not be viewed as a replacement for people. But, the work we do will change as a result of it.","theme":5,"origin":"participant","place":"Redmond","chips":["REDMOND, OR","55-64","MALE","WHITE OR CAUCASIAN","REPUBLICAN / CONSERVATIVE"],"vote":{"total":38,"A":{"a":14,"d":1,"p":4,"n":19,"pct":74},"B":{"a":18,"d":0,"p":1,"n":19,"pct":95},"gap":21,"minAgree":74,"consensus":0},"source":"Open Poll","tags":["Workforce / Labor"],"inReport":false},{"id":"p121","kind":"poll","text":"AI should sharpen human judgment, not substitute for it. If we let it think for us instead of improving us, we trade agency for convenience. The risk is that we will choose the \"easy button\" temptation of AI over improving ones thinking.","theme":6,"origin":"participant","place":"Redmond","chips":["REDMOND, OR","65+","MALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":40,"A":{"a":16,"d":0,"p":1,"n":17,"pct":94},"B":{"a":22,"d":0,"p":1,"n":23,"pct":96},"gap":2,"minAgree":94,"consensus":1},"source":"Open Poll","tags":["Existential Risk"],"inReport":false},{"id":"p122","kind":"poll","text":"We should not blindly trust developers, promoters of AI. The Pope is correct in saying \"AI should be disarmed.\"","theme":1,"origin":"participant","place":"Bend","chips":["BEND, OR","65+","MALE","WHITE OR CAUCASIAN","DEMOCRAT / PROGRESSIVE / LIBERAL"],"vote":{"total":38,"A":{"a":18,"d":0,"p":1,"n":19,"pct":95},"B":{"a":13,"d":2,"p":4,"n":19,"pct":68},"gap":27,"minAgree":68,"consensus":0},"source":"Open Poll","tags":["Governance & Decision-making"],"inReport":false},{"id":"p123","kind":"poll","text":"There should be no tax credits for AI data centers - these centers raise everyone's electric bill, create very few jobs and their usefulness is 95},"gap":0,"minAgree":95,"consensus":1},"source":"Open Poll","tags":["Data Centers","Governance & Decision-making","Environment"],"inReport":false},{"id":"p130","kind":"poll","text":"AI companies should not receive “liability shields” from lawsuits that stem from negative environmental or health effects that arise from the construction and operation of data centers. They need to pay for negative side effects.","theme":2,"origin":"participant","place":"Culver","chips":["CULVER, OR","35-44","MALE","WHITE OR CAUCASIAN","REPUBLICAN / CONSERVATIVE"],"vote":{"total":40,"A":{"a":22,"d":0,"p":0,"n":22,"pct":100},"B":{"a":13,"d":2,"p":3,"n":18,"pct":72},"gap":28,"minAgree":72,"consensus":0},"source":"Open Poll","tags":["AI Companies","Governance & Decision-making","Environment"],"inReport":false},{"id":"p131","kind":"poll","text":"There are too many lies and half-truths from AI companies and community leaders about the “job opportunities” that AI data centers will produce once built.","theme":2,"origin":"participant","place":"Culver","chips":["CULVER, OR","35-44","MALE","WHITE OR CAUCASIAN","REPUBLICAN / CONSERVATIVE"],"vote":{"total":40,"A":{"a":20,"d":0,"p":1,"n":21,"pct":95},"B":{"a":13,"d":2,"p":4,"n":19,"pct":68},"gap":27,"minAgree":68,"consensus":0},"source":"Open Poll","tags":["Data Centers","Workforce / Labor","Public Education"],"inReport":false},{"id":"p134","kind":"poll","text":"Every organization should implement an AI policy that protects company data and prevents confidential or proprietary information from being entered into generative AI tools.","theme":8,"origin":"participant","place":"Bend","chips":["BEND, OR","45-54","FEMALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":36,"A":{"a":18,"d":0,"p":0,"n":18,"pct":100},"B":{"a":12,"d":1,"p":5,"n":18,"pct":67},"gap":33,"minAgree":67,"consensus":0},"source":"Open Poll","tags":[],"inReport":false},{"id":"p135","kind":"poll","text":"Tech workers in Oregon should form an Oregon Tech Workers Union to protect ourselves from AI related corporate layoffs, salary reductions, position eliminations, etc.","theme":5,"origin":"participant","place":"Bend","chips":["BEND, OR","35-44","MALE","WHITE OR CAUCASIAN","NO PARTY PREFERENCE / INDEPENDENT"],"vote":{"total":25,"A":{"a":9,"d":0,"p":6,"n":15,"pct":60},"B":{"a":3,"d":2,"p":5,"n":10,"pct":30},"gap":30,"minAgree":30,"consensus":0},"source":"Open Poll","tags":["AI Companies","Workforce / Labor"],"inReport":false},{"id":"p141","kind":"poll","text":"We need to prioritize building a rigorous, apolitical evidence base around AI's impact on many things- child development, worker outcomes, environmental impacts, social connection, professional interactions, research capabilities.","theme":7,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","Not Provided"],"vote":{"total":29,"A":{"a":17,"d":0,"p":0,"n":17,"pct":100},"B":{"a":12,"d":0,"p":0,"n":12,"pct":100},"gap":0,"minAgree":100,"consensus":1},"source":"Open Poll","tags":["Public Education"],"inReport":false},{"id":"p142","kind":"poll","text":"While AI companies should be engaged in measuring the impact of their tools and responsive to government and community sentiment, it's not their job (alone) to find solutions. Many parts of society need to be part of shaping solutions.","theme":1,"origin":"participant","place":"Sisters","chips":["SISTERS, OR","Not Provided"],"vote":{"total":27,"A":{"a":8,"d":3,"p":2,"n":13,"pct":62},"B":{"a":12,"d":0,"p":2,"n":14,"pct":86},"gap":24,"minAgree":62,"consensus":0},"source":"Open Poll","tags":["AI Companies","Government / Public Sector","Governance & Decision-making"],"inReport":false},{"id":"p143","kind":"poll","text":"We don't yet know how to effectively regulate AI, but that shouldn't stop us from introducing any regulation or safeguards. We need to be trying good ideas, evaluating carefully, and create mechanisms that can evolve quickly.","theme":1,"origin":"participant","place":"Sisters","chips":["SISTERS, OR",
